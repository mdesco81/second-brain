services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: second_brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d second_brain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/second_brain
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_MODE: webhook
      APP_BASE_URL: https://${DOMAIN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      PROACTIVE_HOUR: ${PROACTIVE_HOUR:-9}
      PROACTIVE_MINUTE: ${PROACTIVE_MINUTE:-0}
      WEEKLY_REPORT_DAY: ${WEEKLY_REPORT_DAY:-1}
      WEEKLY_REPORT_HOUR: ${WEEKLY_REPORT_HOUR:-8}
      WEEKLY_REPORT_MINUTE: ${WEEKLY_REPORT_MINUTE:-30}
      STORAGE_ROOT: /app/storage/SecondBrain
    volumes:
      - brain_storage:/app/storage/SecondBrain
    restart: always

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  pg_data:
  brain_storage:
  caddy_data:
  caddy_config:
