<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Brain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1 class="logo">Second Brain</h1>
        <div class="search-box">
          <input type="search" id="search" placeholder="Buscar cards..." autocomplete="off" />
        </div>
      </header>

      <section class="alerts-bar" id="alerts"></section>

      <nav class="filters-bar">
        <div class="filter-group">
          <button type="button" class="chip active" data-filter-priority="all">Todas</button>
          <button type="button" class="chip pri-alta" data-filter-priority="ALTA">Alta</button>
          <button type="button" class="chip pri-media" data-filter-priority="MEDIA">Media</button>
          <button type="button" class="chip pri-baixa" data-filter-priority="BAIXA">Baixa</button>
        </div>
        <div class="filter-group">
          <select id="filter-category">
            <option value="all">Todas categorias</option>
          </select>
        </div>
      </nav>

      <section class="stats-strip" id="stats"></section>

      <section class="kanban-board" id="kanban-board">
        <div class="kanban-column" data-status="open">
          <div class="kanban-header">
            <h2>Abertos</h2>
            <span class="kanban-count" id="count-open">0</span>
          </div>
          <div class="kanban-cards" id="col-open"></div>
        </div>
        <div class="kanban-column" data-status="done">
          <div class="kanban-header">
            <h2>Resolvidos</h2>
            <span class="kanban-count" id="count-done">0</span>
          </div>
          <div class="kanban-cards" id="col-done"></div>
        </div>
        <div class="kanban-column" data-status="eliminated">
          <div class="kanban-header">
            <h2>Eliminados</h2>
            <span class="kanban-count" id="count-eliminated">0</span>
          </div>
          <div class="kanban-cards" id="col-eliminated"></div>
        </div>
      </section>

      <div class="empty-state" id="empty-state" style="display:none">
        Nenhum card encontrado com os filtros atuais.
      </div>
    </main>

    <!-- FAB: New Card -->
    <button type="button" class="fab" id="fab-new-card" title="Novo card">+</button>

    <!-- New Card Modal -->
    <dialog id="new-modal">
      <form method="dialog" class="edit-form" id="new-form">
        <header class="modal-header">
          <h2>Novo Card</h2>
          <button type="button" class="close-btn" id="new-modal-close">&times;</button>
        </header>

        <div class="field">
          <label for="new-summary">Descricao / Nota *</label>
          <textarea id="new-summary" rows="3" placeholder="O que voce quer registrar?"></textarea>
        </div>

        <div class="field">
          <label for="new-action-title">Titulo da acao</label>
          <input type="text" id="new-action-title" placeholder="Ex: Ligar para o contador" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="new-priority">Prioridade</label>
            <select id="new-priority">
              <option value="ALTA">Alta</option>
              <option value="MEDIA" selected>Media</option>
              <option value="BAIXA">Baixa</option>
            </select>
          </div>
          <div class="field">
            <label for="new-due">Prazo</label>
            <input type="date" id="new-due" />
          </div>
          <div class="field">
            <label for="new-category">Categoria</label>
            <select id="new-category"></select>
          </div>
        </div>

        <div class="field">
          <label for="new-next-step">Proximo passo</label>
          <input type="text" id="new-next-step" placeholder="Qual a proxima acao concreta?" />
        </div>

        <div class="field">
          <label for="new-owner">Responsavel</label>
          <input type="text" id="new-owner" placeholder="Quem vai executar?" />
        </div>

        <footer class="modal-footer">
          <button type="button" class="btn secondary" id="new-modal-cancel">Cancelar</button>
          <button type="submit" class="btn primary" id="new-modal-save">Criar</button>
        </footer>
      </form>
    </dialog>

    <dialog id="edit-modal">
      <form method="dialog" class="edit-form" id="edit-form">
        <header class="modal-header">
          <h2>Editar Card <span id="edit-card-id"></span></h2>
          <button type="button" class="close-btn" id="modal-close">&times;</button>
        </header>

        <div class="field">
          <label for="edit-summary">Interpretacao / Resumo</label>
          <textarea id="edit-summary" rows="2"></textarea>
        </div>

        <div class="field">
          <label for="edit-action-title">Titulo da acao</label>
          <input type="text" id="edit-action-title" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="edit-priority">Prioridade</label>
            <select id="edit-priority">
              <option value="ALTA">Alta</option>
              <option value="MEDIA">Media</option>
              <option value="BAIXA">Baixa</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-due">Prazo</label>
            <input type="date" id="edit-due" />
          </div>
          <div class="field">
            <label for="edit-category">Categoria</label>
            <select id="edit-category"></select>
          </div>
        </div>

        <div class="field">
          <label for="edit-next-step">Proximo passo</label>
          <input type="text" id="edit-next-step" />
        </div>

        <div class="field">
          <label for="edit-owner">Responsavel</label>
          <input type="text" id="edit-owner" />
        </div>

        <footer class="modal-footer">
          <button type="button" class="btn secondary" id="modal-cancel">Cancelar</button>
          <button type="submit" class="btn primary" id="modal-save">Salvar</button>
        </footer>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
