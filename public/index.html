<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Brain Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-glow"></div>
    <main class="layout">
      <header class="hero card reveal">
        <p class="eyebrow">Second Brain MVP</p>
        <h1>Painel de Operacoes</h1>
        <p class="subtitle">
          Captura via Telegram ativa para texto, audio, PDF e imagens. Este painel mostra classificacao, backlog e ritmo diario.
        </p>
      </header>

      <section class="stats reveal" id="stats"></section>

      <section class="grid">
        <article class="card reveal" style="animation-delay: 80ms">
          <h2>Categorias</h2>
          <ul class="list" id="categories"></ul>
        </article>

        <article class="card reveal" style="animation-delay: 110ms">
          <h2>Foco Atual</h2>
          <ul class="list" id="focus"></ul>
        </article>

        <article class="card reveal" style="animation-delay: 140ms">
          <h2>Ultimos Registros</h2>
          <ul class="list" id="recent"></ul>
        </article>
      </section>
    </main>

    <template id="stat-template">
      <article class="card stat-card">
        <p class="label"></p>
        <p class="value"></p>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
