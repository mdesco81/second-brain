services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: second_brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d second_brain"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/second_brain
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
      APP_BASE_URL: ${APP_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      PROACTIVE_HOUR: ${PROACTIVE_HOUR:-9}
      PROACTIVE_MINUTE: ${PROACTIVE_MINUTE:-0}
      STORAGE_ROOT: /app/storage/SecondBrain
    ports:
      - "8080:8080"
    volumes:
      - brain_storage:/app/storage/SecondBrain
    restart: always

volumes:
  pg_data:
  brain_storage:
