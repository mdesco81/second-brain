services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: second_brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d second_brain"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/second_brain
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      APP_BASE_URL: ${APP_BASE_URL:-}
      # AI providers
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_PREMIUM_MODEL: ${ANTHROPIC_PREMIUM_MODEL:-claude-opus-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      # Schedule
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      PROACTIVE_HOUR: ${PROACTIVE_HOUR:-9}
      PROACTIVE_MINUTE: ${PROACTIVE_MINUTE:-0}
      WEEKLY_REPORT_DAY: ${WEEKLY_REPORT_DAY:-1}
      WEEKLY_REPORT_HOUR: ${WEEKLY_REPORT_HOUR:-8}
      WEEKLY_REPORT_MINUTE: ${WEEKLY_REPORT_MINUTE:-30}
      # Google Calendar (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      CALENDAR_SYNC_INTERVAL_MIN: ${CALENDAR_SYNC_INTERVAL_MIN:-5}
      PRE_MEETING_MINUTES: ${PRE_MEETING_MINUTES:-15}
      POST_MEETING_MINUTES: ${POST_MEETING_MINUTES:-10}
      # SMTP email (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STORAGE_ROOT: /app/storage/SecondBrain
    ports:
      - "8080:8080"
    volumes:
      - brain_storage:/app/storage/SecondBrain
    restart: always

volumes:
  pg_data:
  brain_storage:
